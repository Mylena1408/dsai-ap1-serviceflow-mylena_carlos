name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pinned: "ubuntu-latest" moves to Ubuntu 26 from 2026-10-19, which the Playwright in use
    # (1.56) does not support for `install --with-deps`.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: serviceflow
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: serviceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviceflow -d serviceflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Must differ from TEST_DATABASE_URL: the test guard refuses to run when both point to the same database.
      DATABASE_URL: postgresql://serviceflow:change-me@localhost:5432/serviceflow_dev?schema=public
      TEST_DATABASE_URL: postgresql://serviceflow:change-me@localhost:5432/serviceflow_test?schema=public
      AUTH_SECRET: ci-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so the secret scan covers every commit, not only the last one.
          fetch-depth: 0

      # Official gitleaks release, pinned by version and SHA-256 (no third-party Action, no npm
      # dependency). Reviewed false positives are listed in .gitleaksignore.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          # Retries: the release download failed twice on 2026-11-08 with transient GitHub errors (504, cut connection).
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

      - name: Create development database
        run: createdb -h localhost -U serviceflow serviceflow_dev
        env:
          PGPASSWORD: change-me

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
